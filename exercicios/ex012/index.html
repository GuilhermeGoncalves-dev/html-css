<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserir videos hospedados lovalmente </h1>
    <p>Este videos esta hospedados no meu proprio servidor</p>
    <video src="midio/meu-video.mp4.mp4" width="560" controls poster="imagens/produto-camisa.webp" loop autoplay></video>

    <h1>Inserindo videos no youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/OzUnqQk4eOg?si=T0vKG8lltnm4ff_s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
