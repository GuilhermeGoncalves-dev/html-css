<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens Flexível</title>
</head>
<body>
    <h1>Imagens Flexível</h1>
    <p>Você está vendo a imagens completa? Experimente ampliar o tamanho da sua janela para aproveita a melhor experiencia</p>
    <picture>
        <source media="(max-width: 750px )" srcset="imagens/paisagem-p.png">
        <source media="(max-width:900px )" srcset="imagens/paisagem-m.png">
        <img src="imagens/paisagem-g.png" alt="foto flexivel">
    </picture>
</body>
</html>
